name: Versionsarchive veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/versionsimport.yml]
permissions:
  contents: write
concurrency: versionsimport
jobs:
  windows:
    name: Windows-Paket prüfen
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Archiv aus dem Importentwurf prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          id=$(gh api "$api/releases?per_page=100" | jq -er '.[] | select(.draft and .name == "Versionsimport") | .assets[] | select(.name == "Pruefpaket-0.12.2.zip") | .id' | tr -d '\r')
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/$api/releases/assets/$id" -o studio.zip
          echo '4fb3ff25025a19322067c26641cdf890408be7e5068e156e4dea75637de3ee25  studio.zip' | sha256sum -c
          unzip -q studio.zip
      - name: Installation, Explorer und Deinstallation prüfen
        run: ./Rust-3D-Print-Studio-0.12.2/scripts/windows-abnahme.ps1
      - name: OpenGL-Testumgebung für den Windows-Runner vorbereiten
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --needed --noconfirm mingw-w64-x86_64-mesa'
          if ($LASTEXITCODE -ne 0) { throw 'Mesa-Installation für Runner fehlgeschlagen' }
      - name: Portables Studio mit Software-OpenGL öffnen und Projekt speichern
        shell: pwsh
        run: ./Rust-3D-Print-Studio-0.12.2/scripts/windows-tastenabnahme.ps1
  import:
    needs: windows
    if: github.repository == 'ubi-psifu/rust-3d-print-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Quellstände und Originalarchive prüfen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/releases?per_page=100" | jq -e '[.[] | select(.draft and .name == "Versionsimport")] | if length == 1 then .[0].assets else error("Importentwurf fehlt") end' > "$dir/assets.json"
          download() {
            local id
            id=$(jq -er --arg file "$1" '.[] | select(.name == $file) | .id' "$dir/assets.json")
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/$api/releases/assets/$id" -o "$dir/$1"
          }
          download version-0.12.2-rc2.bundle
          echo "d5a7b8625ba0ca2d117da1292ba3c6c491fda5a07728db3459f5a562d0781168  $dir/version-0.12.2-rc2.bundle" | sha256sum -c
          git bundle verify "$dir/version-0.12.2-rc2.bundle"
          git fetch --no-tags "$dir/version-0.12.2-rc2.bundle" refs/heads/kurze-tasten:refs/remotes/import/versions
          tags=(v0.12.2)
          for tag in "${tags[@]}"; do
            v=${tag#v}
            file="Rust-3D-Print-Studio-$v.zip"
            git show "refs/remotes/import/versions:docs/releases/$v.md" > "$dir/$v.md"
            sha=$(grep -oE '[0-9a-f]{64}' "$dir/$v.md" | tail -1)
            download "Pruefpaket-$v.zip"
            mv "$dir/Pruefpaket-$v.zip" "$dir/$file"
            echo "$sha  $dir/$file" | sha256sum -c
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit -m 'Plattenbedienung 0.12.2 integrieren' refs/remotes/import/versions
          if git ls-remote --exit-code --tags origin refs/tags/v0.12.2 > /dev/null; then
            git diff --exit-code refs/remotes/import/versions HEAD -- . ':(exclude).github/workflows'
            git push origin HEAD:refs/heads/main
          else
            git diff --exit-code refs/remotes/import/versions HEAD -- . ':(exclude).github/workflows'
            git push --atomic origin HEAD:refs/heads/main HEAD:refs/tags/v0.12.2
          fi
          for tag in "${tags[@]}"; do
            v=${tag#v}
            if gh release view "$tag" > /dev/null 2>&1; then continue; fi
            latest=false
            if [[ $tag == v0.12.2 ]]; then latest=true; fi
            gh release create "$tag" "$dir/Rust-3D-Print-Studio-$v.zip" --verify-tag --title "Rust 3D Print Studio $v" --notes-file "$dir/$v.md" --latest="$latest"
          done
