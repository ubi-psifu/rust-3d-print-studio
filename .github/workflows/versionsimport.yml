name: Versionsarchive veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/versionsimport.yml]
permissions:
  contents: write
concurrency: versionsimport
jobs:
  import:
    if: github.repository == 'ubi-psifu/rust-3d-print-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Quellstände und Originalarchive prüfen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/releases?per_page=100" | jq -e '[.[] | select(.draft and .name == "Versionsimport")] | if length == 1 then .[0].assets else error("Importentwurf fehlt") end' > "$dir/assets.json"
          download() {
            local id
            id=$(jq -er --arg file "$1" '.[] | select(.name == $file) | .id' "$dir/assets.json")
            gh api -H 'Accept: application/octet-stream' "$api/releases/assets/$id" > "$dir/$1"
          }
          download quellhistorie.bundle
          echo "993d9c951dbd08fecf9045e129f3e623dc13348a1549d8e51ceb2aee3c56c60f  $dir/quellhistorie.bundle" | sha256sum -c
          git bundle verify "$dir/quellhistorie.bundle"
          git fetch "$dir/quellhistorie.bundle" refs/heads/versions:refs/remotes/import/versions 'refs/tags/v*:refs/tags/v*'
          tags=(v0.1.0 v0.2.0 v0.3.0 v0.5.0 v0.6.0 v0.7.0 v0.8.0 v0.9.0 v0.10.0)
          for tag in "${tags[@]}"; do
            v=${tag#v}
            file="Rust-3D-Print-Studio-$v.zip"
            git show "$tag:docs/releases/$v.md" > "$dir/$v.md"
            sha=$(grep -oE '[0-9a-f]{64}' "$dir/$v.md" | tail -1)
            download "$file"
            echo "$sha  $dir/$file" | sha256sum -c
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --allow-unrelated-histories -X theirs -m 'Versionierte Quellstände aus den Originalarchiven importieren' refs/remotes/import/versions
          git push --atomic origin HEAD:refs/heads/main "${tags[@]}"
          for tag in "${tags[@]}"; do
            v=${tag#v}
            if gh release view "$tag" > /dev/null 2>&1; then continue; fi
            latest=false
            if [[ $tag == v0.10.0 ]]; then latest=true; fi
            gh release create "$tag" "$dir/Rust-3D-Print-Studio-$v.zip" --verify-tag --title "Rust 3D Print Studio $v" --notes-file "$dir/$v.md" --latest="$latest"
          done
