name: Versionsarchive veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/versionsimport.yml]
permissions:
  contents: write
concurrency: versionsimport
jobs:
  windows:
    name: Windows-Paket prüfen
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Geprüften Quellstand integrieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          id=$(gh api "$api/releases?per_page=100" | jq -er '.[] | select(.draft and .name == "Versionsimport") | .assets[] | select(.name == "version-0.18.0.bundle") | .id' | tr -d '\r')
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/$api/releases/assets/$id" -o source.bundle
          echo '18be5840501b66b3f098f0c5599f90c1fb4aea50e9098d5d43f796dafbb372fb  source.bundle' | sha256sum -c
          git bundle verify source.bundle
          git fetch --no-tags ./source.bundle refs/heads/schnittachsen:refs/remotes/import/versions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit -m 'Schalenvorschau 0.18.0 integrieren' refs/remotes/import/versions
          git diff --exit-code refs/remotes/import/versions HEAD -- . ':(exclude).github/workflows'
      - name: Windows-x64-Programm und Installer bauen
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust-Installation fehlgeschlagen' }
          $env:RUSTUP_TOOLCHAIN='1.88.0'
          $env:PATH="${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          ./scripts/windows.ps1 -Installer
      - name: Installation, Explorer und Deinstallation prüfen
        run: ./scripts/windows-abnahme.ps1
      - name: OpenGL-Testumgebung für den Windows-Runner vorbereiten
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --needed --noconfirm mingw-w64-x86_64-mesa'
          if ($LASTEXITCODE -ne 0) { throw 'Mesa-Installation für Runner fehlgeschlagen' }
      - name: Portables Studio mit Software-OpenGL öffnen und Projekt speichern
        shell: pwsh
        run: ./scripts/windows-tastenabnahme.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-geprueft
          path: dist/*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Geprüften Quellstand integrieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          id=$(gh api "$api/releases?per_page=100" | jq -er '.[] | select(.draft and .name == "Versionsimport") | .assets[] | select(.name == "version-0.18.0.bundle") | .id' | tr -d '\r')
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/$api/releases/assets/$id" -o source.bundle
          echo '18be5840501b66b3f098f0c5599f90c1fb4aea50e9098d5d43f796dafbb372fb  source.bundle' | sha256sum -c
          git bundle verify source.bundle
          git fetch --no-tags ./source.bundle refs/heads/schnittachsen:refs/remotes/import/versions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit -m 'Schalenvorschau 0.18.0 integrieren' refs/remotes/import/versions
          git diff --exit-code refs/remotes/import/versions HEAD -- . ':(exclude).github/workflows'
      - name: Linux-Build und Modellabnahme
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          export RUSTUP_TOOLCHAIN=1.88.0
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --release --locked
          mkdir -p dist
          cp target/release/rust-3d-print-studio dist/rust-3d-print-studio-linux-x64
      - name: Öffnungsfläche im Linux-Fenster anklicken und speichern
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool imagemagick tesseract-ocr tesseract-ocr-deu libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1600x900x24' python3 scripts/linux-flaechenabnahme.py dist/rust-3d-print-studio-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-geprueft
          path: dist/rust-3d-print-studio-linux-x64
          if-no-files-found: error
  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Geprüften Quellstand integrieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          id=$(gh api "$api/releases?per_page=100" | jq -er '.[] | select(.draft and .name == "Versionsimport") | .assets[] | select(.name == "version-0.18.0.bundle") | .id' | tr -d '\r')
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/$api/releases/assets/$id" -o source.bundle
          echo '18be5840501b66b3f098f0c5599f90c1fb4aea50e9098d5d43f796dafbb372fb  source.bundle' | sha256sum -c
          git bundle verify source.bundle
          git fetch --no-tags ./source.bundle refs/heads/schnittachsen:refs/remotes/import/versions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit -m 'Schalenvorschau 0.18.0 integrieren' refs/remotes/import/versions
          git diff --exit-code refs/remotes/import/versions HEAD -- . ':(exclude).github/workflows'
      - uses: actions/download-artifact@v4
        with:
          name: windows-geprueft
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-geprueft
          path: dist
      - name: Download prüfen und Version veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix=Rust-3D-Print-Studio-0.18.0
          file="$prefix.zip"
          notes=docs/releases/0.18.0.md
          sed -i '/^SHA-256 des Downloadarchivs:/d' "$notes"
          echo "71 Rust-Tests bestanden. Seitlich und frontal wurden an der um 90° gedrehten Schale bei 25, 50 und 75 Prozent jeweils 192 bzw. 184 mm² Schnittfläche bestätigt. Linux-Fensterabnahme mit sichtbaren Schnittflächen in allen drei Richtungen, Originalvergleich, Vorschauabbruch, Kanten- und Flächenklick, Speichern, Rückgängig und Wiederholen bestanden. Windows-Server-Abnahme bestanden. Die portable EXE öffnete und speicherte die Keilschale samt Flächenbezug. [Prüfprotokoll](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$notes"
          git add "$notes"
          git commit -m 'Abnahme der Schalenvorschau dokumentieren'
          mkdir "$prefix"
          git archive HEAD | tar -x -C "$prefix"
          chmod +x dist/rust-3d-print-studio-linux-x64
          cp -r dist "$prefix/"
          zip -qr "$file" "$prefix"
          unzip -tq "$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          cp "$notes" release.md
          printf '\nSHA-256 des Downloadarchivs: %s\n' "$sha" >> release.md
          git push --atomic origin HEAD:refs/heads/main HEAD:refs/tags/v0.18.0
          gh release create v0.18.0 "$file" --verify-tag --notes-file release.md --title 'Rust 3D Print Studio 0.18.0' --latest
          curl -fsSL --retry 4 "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.18.0/$file" -o public.zip
          cmp "$file" public.zip
