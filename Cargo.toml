[package]
name = "rust-3d-print-studio"
version = "0.24.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
macroquad = { version = "=0.4.14", default-features = false }
egui-macroquad = { version = "=0.17.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
glam = { version = "=0.27.0", features = ["serde"] }
tempfile = "=3.23.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
boolmesh = "=0.2.2"
ttf-parser = "=0.25.1"
epaint_default_fonts = "=0.31.1"
quick-xml = "=0.41.0"
